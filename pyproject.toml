[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ap2-evidence-pack"
version = "1.5.3"
description = "Self-contained, offline-verifiable dispute evidence for agentic-payment SD-JWT mandates (AP2)"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [{name = "Roberto Locatelli"}]
readme = "README.md"
# 1.1.1: declared, because it was not. `pip install ap2-evidence-pack` produced a package whose import failed with
# ModuleNotFoundError: cryptography — the README told you to install it by hand, which is not the same as a working install.
dependencies = ["cryptography>=48"]

[project.urls]
Homepage = "https://github.com/robertolocatelli81-dev/ap2-evidence-pack"

[project.scripts]
ap2-evidence = "ap2_evidence:main"

[tool.setuptools]
py-modules = ["ap2_evidence"]
# 1.3.0: the wheel installs the signature suite as `ap2_pqcrypto/`, not `pqcrypto/`: PyPI's `pqcrypto` (1.0.0) owns that
# directory, and installing this package on top of it emptied its `__init__.py` (measured 2026-10-05: `from pqcrypto import
# ml_kem_512` stopped working). The clone keeps `pqcrypto/`; ap2_evidence looks in both.
packages = ["ap2_pqcrypto"]

[tool.setuptools.package-dir]
ap2_pqcrypto = "pqcrypto"
